<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Me amas?</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff0f4;
      overflow: hidden;
      font-family: Georgia, 'Times New Roman', serif;
      position: relative;
    }

    #heart-bg-img {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(520px, 90vw);
      height: auto;
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
    }

    #petal-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .card {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 48px 56px 44px;
      background: rgba(255,255,255,0.82);
      border-radius: 32px;
      border: 1.5px solid rgba(220, 80, 120, 0.18);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 48px rgba(192,0,58,0.10);
      max-width: 520px;
      width: 90vw;
    }

    #question {
      font-size: clamp(28px, 6vw, 46px);
      font-weight: bold;
      color: #b8003a;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(192,0,58,0.10);
    }

    #subtitle {
      font-size: 15px;
      color: #d06080;
      font-style: italic;
      margin-bottom: 44px;
    }

    #btn-row {
      display: flex;
      gap: 28px;
      align-items: center;
      justify-content: center;
      min-height: 64px;
    }

    .btn {
      padding: 14px 44px;
      font-size: 20px;
      font-family: Georgia, serif;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      user-select: none;
    }

    #yes-btn {
      background: linear-gradient(135deg, #ff6b8a, #b8003a);
      color: #fff;
      box-shadow: 0 4px 20px rgba(184,0,58,0.30);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #yes-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 28px rgba(184,0,58,0.40);
    }

    /* No button floats freely over the whole page */
    #no-btn {
      background: #fff0f4;
      color: #b8003a;
      border: 2px solid #f7b0c0;
      box-shadow: 0 2px 10px rgba(192,0,58,0.08);
      position: fixed;
      z-index: 9999;
      transition: none;
      pointer-events: none; /* cursor can NEVER actually click it */
    }

    #yes-msg {
      display: none;
      margin-top: 32px;
      font-size: clamp(18px, 4vw, 26px);
      color: #b8003a;
      font-style: italic;
      animation: popIn 0.55s cubic-bezier(.17,.89,.32,1.27);
    }
    @keyframes popIn {
      0%   { transform: scale(0.4); opacity: 0; }
      70%  { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1);   opacity: 1; }
    }

    .fheart {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      z-index: 10000;
      animation: floatUp 2.4s ease-in forwards;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-180px) scale(1.6); }
    }

    @media (max-width: 480px) {
      .card { padding: 32px 20px 28px; }
      #btn-row { gap: 16px; }
      .btn { padding: 12px 28px; font-size: 17px; }
    }
  </style>
</head>
<body>

  <img
    id="heart-bg-img"
    src="C:\Users\User\Downloads\download__1_.jpg"
    alt=""
    aria-hidden="true"
  />

  <canvas id="petal-canvas"></canvas>

  <div class="card">
    <div id="question">¿Me amas?</div>
    <div id="subtitle">Por favor, elige con el corazón</div>

    <div id="btn-row">
      <button class="btn" id="yes-btn" onclick="onYes()">Sí 💖</button>
      <button class="btn" id="no-btn">No</button>
    </div>

    <div id="yes-msg">¡Sabía que me amarías! 💕✨</div>
  </div>

  <script>
    const noBtn  = document.getElementById('no-btn');
    const yesBtn = document.getElementById('yes-btn');

    let noX = 0, noY = 0, noBtnW = 0, noBtnH = 0;
    let answered = false;

    /* ── Place No button next to Yes on load ── */
    function placeNoInitial() {
      noBtnW = noBtn.offsetWidth  || 90;
      noBtnH = noBtn.offsetHeight || 50;
      const r = yesBtn.getBoundingClientRect();
      noX = r.right + 32;
      noY = r.top + (r.height - noBtnH) / 2;
      applyPos(noX, noY);
    }

    /* ── Clamp inside viewport and apply ── */
    function applyPos(x, y) {
      const m = 14;
      x = Math.max(m, Math.min(x, window.innerWidth  - noBtnW - m));
      y = Math.max(m, Math.min(y, window.innerHeight - noBtnH - m));
      noX = x; noY = y;
      noBtn.style.left = x + 'px';
      noBtn.style.top  = y + 'px';
    }

    /* ── Core flee logic ── 
       Trigger zone = 160px radius. Button jumps far away immediately.
       The larger the push value, the farther it leaps each frame.       */
    function flee(mx, my) {
      if (answered) return;
      const cx = noX + noBtnW / 2;
      const cy = noY + noBtnH / 2;
      const dx = mx - cx;
      const dy = my - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const TRIGGER = 160;   /* start fleeing at 160px away */
      if (dist < TRIGGER) {
        const angle = Math.atan2(dy, dx);
        /* push = how far to jump: bigger when cursor is closer */
        const push = (TRIGGER - dist) * 2.2 + 80;
        applyPos(
          noX - Math.cos(angle) * push,
          noY - Math.sin(angle) * push
        );
      }
    }

    document.addEventListener('mousemove', e => flee(e.clientX, e.clientY));
    document.addEventListener('touchmove', e => {
      flee(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener('load',   () => setTimeout(placeNoInitial, 80));
    window.addEventListener('resize', placeNoInitial);

    /* ── Yes button ── */
    function onYes() {
      if (answered) return;
      answered = true;
      noBtn.style.display = 'none';
      document.getElementById('yes-msg').style.display = 'block';
      const r = yesBtn.getBoundingClientRect();
      for (let i = 0; i < 20; i++) {
        setTimeout(() => spawnHeart(
          r.left + Math.random() * r.width, r.top
        ), i * 100);
      }
    }

    function spawnHeart(x, y) {
      const h = document.createElement('span');
      h.className = 'fheart';
      h.textContent = ['❤️','💖','💗','💓','💕','💘'][Math.floor(Math.random()*6)];
      h.style.left = (x + (Math.random()-0.5)*60) + 'px';
      h.style.top  = y + 'px';
      h.style.animationDuration = (1.8 + Math.random()*0.9) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 3000);
    }

    /* ── Falling heart petals (canvas) ── */
    const canvas = document.getElementById('petal-canvas');
    const ctx    = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function makePetal() {
      return {
        x:      Math.random() * canvas.width,
        y:      -20 - Math.random() * canvas.height,
        r:      5 + Math.random() * 8,
        speedY: 0.5 + Math.random() * 1.2,
        speedX: (Math.random()-0.5) * 0.8,
        angle:  Math.random() * Math.PI * 2,
        spin:   (Math.random()-0.5) * 0.05,
        alpha:  0.45 + Math.random() * 0.45,
        color:  ['#e84070','#c0003a','#f07090','#d03060','#ff9ab8'][Math.floor(Math.random()*5)]
      };
    }

    const petals = Array.from({length: 30}, () => {
      const p = makePetal();
      p.y = Math.random() * canvas.height;
      return p;
    });

    function drawHeart(x, y, r, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle   = color;
      ctx.beginPath();
      ctx.moveTo(x, y + r*0.3);
      ctx.bezierCurveTo(x, y-r*0.3, x-r, y-r*0.3, x-r, y+r*0.3);
      ctx.bezierCurveTo(x-r, y+r*0.8, x, y+r*1.3, x, y+r*1.6);
      ctx.bezierCurveTo(x, y+r*1.3, x+r, y+r*0.8, x+r, y+r*0.3);
      ctx.bezierCurveTo(x+r, y-r*0.3, x, y-r*0.3, x, y+r*0.3);
      ctx.fill();
      ctx.restore();
    }

    function animatePetals() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      petals.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        drawHeart(0, 0, p.r, p.color, p.alpha);
        ctx.restore();
        p.x += p.speedX;
        p.y += p.speedY;
        p.angle += p.spin;
        if (p.y > canvas.height + 30) {
          const np = makePetal();
          Object.assign(p, np);
        }
      });
      requestAnimationFrame(animatePetals);
    }
    animatePetals();
  </script>
</body>
</html>
